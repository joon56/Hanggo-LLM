name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install audio and browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npx playwright install --with-deps chrome
      - name: Unit tests, types, build, browser tests, fixtures
        run: npm run verify
      - name: Browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-traces
          path: .tmp/browser-results/
          if-no-files-found: ignore
          retention-days: 7

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t hanggo-ci .
      - name: Verify production startup and bundled tools
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name hanggo-ci -p 127.0.0.1:3001:3001 \
            -e PUBLIC_ORIGIN=https://hanggo.example \
            -e APP_ACCESS_PASSWORD=ci-only-test-password \
            -e AI_ENABLED=false hanggo-ci
          trap 'docker logs hanggo-ci; docker rm -f hanggo-ci' EXIT
          curl --fail --retry 20 --retry-connrefused --retry-delay 2 http://127.0.0.1:3001/api/health
          curl --fail http://127.0.0.1:3001/ -o /dev/null
          docker exec hanggo-ci ffprobe -version
          docker exec hanggo-ci node --input-type=module -e '
            const response = await fetch("http://127.0.0.1:3001/api/session");
            const session = await response.json();
            if (!response.ok || session.authenticated || !session.requirePassword || session.aiEnabled) process.exit(1);
          '
