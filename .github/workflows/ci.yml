name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install audio and browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npx playwright install --with-deps chrome
      - name: Unit tests, types, build, browser tests, fixtures
        run: npm run verify
      - name: Diagnose audio compatibility on failure
        if: failure()
        run: |
          ffmpeg -v error -f lavfi -i anullsrc=r=16000:cl=mono -t 4 -c:a aac -movflags frag_keyframe+empty_moov -f mp4 pipe:1 | \
            ffprobe -v error -i pipe:0 -select_streams a -show_entries stream=duration,sample_rate:packet=pts_time,dts_time,duration_time -of json > /tmp/hanggo-probe.json
          node --input-type=module -e '
            import fs from "node:fs";
            const p = JSON.parse(fs.readFileSync("/tmp/hanggo-probe.json"));
            const invalid = p.packets.filter(p => !Number.isFinite(Number(p.pts_time ?? p.dts_time)) || !Number.isFinite(Number(p.duration_time)) || Number(p.duration_time) <= 0);
            console.log(JSON.stringify({ streams: p.streams, packets: p.packets.length, invalidCount: invalid.length, invalid: invalid.slice(0, 5) }));
          '
      - name: Browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-traces
          path: .tmp/browser-results/
          if-no-files-found: ignore
          retention-days: 7

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t hanggo-ci .
      - name: Verify production startup and bundled tools
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name hanggo-ci -p 127.0.0.1:3001:3001 \
            -e PUBLIC_ORIGIN=https://hanggo.example \
            -e APP_ACCESS_PASSWORD=ci-only-test-password \
            -e AI_ENABLED=false hanggo-ci
          trap 'docker logs hanggo-ci; docker rm -f hanggo-ci' EXIT
          curl --fail --retry 20 --retry-all-errors --retry-delay 2 --max-time 5 http://127.0.0.1:3001/api/health
          curl --fail http://127.0.0.1:3001/ -o /dev/null
          docker exec hanggo-ci ffprobe -version
          docker exec hanggo-ci node --input-type=module -e '
            const response = await fetch("http://127.0.0.1:3001/api/session");
            const session = await response.json();
            if (!response.ok || session.authenticated || !session.requirePassword || session.aiEnabled) process.exit(1);
          '

  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build public demo without API access
        env:
          VITE_PUBLIC_DEMO: "true"
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: npm run build -- --base "/$REPOSITORY_NAME/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deploy
